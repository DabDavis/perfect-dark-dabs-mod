name: Dab's Mod CI

# A separate workflow from c-cpp.yml on purpose: that file is upstream's and is
# left untouched, so merging from the port branch never conflicts here. Disable
# "C/C++ CI" in this repo's Actions tab so a `port` sync does not also kick off
# an eight-target build that has no release to upload to.

on:
  push:
    # A branch push refreshes the rolling dev prerelease; a v* tag cuts a
    # stable release that is never rewritten afterwards.
    branches: [ "dabs-mod" ]
    tags: [ "v*" ]
    # Four builds and a new executable offered to every dev-channel player is
    # too much to ask for a change to a file that is not in the download and
    # not in the binary. Only these qualify: README.md and LICENSE are
    # copied into every package by the packaging steps below, so a fix to one
    # of those has to be built and published like any other change.
    #
    # This is safe for releases: GitHub does not evaluate path filters for tag
    # pushes at all, so a v* tag still builds whatever it points at.
    paths-ignore:
      - 'CLAUDE.md'
      - 'CLAUDE-notes/**'
      - 'DabDavisGitHub.md'
  workflow_dispatch:

env:
  # CMakeLists.txt puts `git rev-parse --abbrev-ref HEAD` on the title screen as
  # "Perfect Dark (<branch>)". actions/checkout leaves a detached HEAD, which it
  # reads as "port-custom", so each job names the checked out commit first.
  MOD_BRANCH: dabs-mod
  # Which release the built copy's Check for Updates follows. A tag build is a
  # stable release and looks for the next stable release; everything else is
  # the rolling dev prerelease and looks for the next one of those. The binary
  # cannot work this out for itself, because the checkout step below forces the
  # branch name to dabs-mod either way.
  UPDATE_CHANNEL: ${{ github.ref_type == 'tag' && 'stable' || 'dev' }}
  # ntsc-final only. The mod has never been tested against PAL or JPN, and
  # building all three would triple the time for two ROMs nobody has asked for.
  ROMID: ntsc-final

jobs:
  build-x86_64-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-cmake
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Name the branch for the version string
        run: |
          git config --global --add safe.directory "$(pwd)"
          git checkout -B "$MOD_BRANCH"
      - name: Build pd.x86_64.exe
        run: cmake -G"Unix Makefiles" -Bbuild -DUPDATE_CHANNEL="$UPDATE_CHANNEL" . && cmake --build build -j
      - name: Prepare artifact for packaging
        run: |
          mkdir -p bin/data
          cp build/pd.x86_64.exe bin/
          # Taken from the binary rather than written out by hand: a list
          # maintained by hand is a list that is one DLL short the first time a
          # dependency changes, which is a game that does not start with no
          # error a player can act on. ldd reports the whole transitive
          # closure; anything outside /mingw64 ships with Windows already -
          # winhttp.dll, which carries Ghost Trials' network half, among them.
          ldd bin/pd.x86_64.exe | awk '/=> \/mingw64/ { print $3 }' | sort -u | xargs -r cp -t bin/
          for dll in SDL2.dll zlib1.dll libwinpthread-1.dll libgcc_s_seh-1.dll; do
            test -f "bin/$dll" || { echo "::error::$dll is missing from the package"; exit 1; }
          done
          # Ghost Trials talks to the server through WinHTTP, so the check that
          # the network half survived is that the import is there rather than
          # that a DLL was copied.
          objdump -p bin/pd.x86_64.exe | grep -qi 'DLL Name: WINHTTP' \
            || { echo "::error::built without WinHTTP - ghost server support is missing"; exit 1; }
          cp README.md LICENSE bin/
          touch bin/data/put_your_rom_here.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pd-dabs-mod-x86_64-windows
          path: bin/
          retention-days: 0

  build-x86_64-linux:
    # 22.04, not ubuntu-latest: the binary is dynamically linked against the
    # builder's glibc, and 24.04 would refuse to start on anything older.
    runs-on: ubuntu-22.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          # libcurl4-openssl-dev is what builds Ghost Trials' accounts,
          # leaderboards and uploads in. The runtime side of it, libcurl4, is
          # on every desktop distribution already - the binary is dynamically
          # linked against the builder's glibc and SDL2 regardless, so this
          # adds a dependency of the same kind rather than a new sort of one.
          sudo apt-get install -y git gcc g++ make cmake libsdl2-dev zlib1g-dev libcurl4-openssl-dev
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Name the branch for the version string
        run: git checkout -B "$MOD_BRANCH"
      - name: Build pd.x86_64
        run: cmake -G"Unix Makefiles" -Bbuild -DUPDATE_CHANNEL="$UPDATE_CHANNEL" . && cmake --build build -j
      - name: Prepare artifact for packaging
        run: |
          mkdir -p bin/data
          cp build/pd.x86_64 bin/
          # See the Windows job: the build drops the ghost network menus
          # rather than failing when libcurl is absent, so the packaging step
          # is what refuses to ship a release that lost them.
          ldd bin/pd.x86_64 | grep -q libcurl || { echo "::error::built without libcurl"; exit 1; }
          cp README.md LICENSE bin/
          touch bin/data/put_your_rom_here.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pd-dabs-mod-x86_64-linux
          path: bin/
          retention-days: 0

  build-osx:
    runs-on: macos-14
    strategy:
      matrix:
        arch: [ x86_64, arm64 ]
    steps:
      - name: Install dependencies
        run: |
          brew install zlib
          wget http://libsdl.org/release/SDL2-2.30.9.dmg -O SDL2.dmg
          hdiutil mount SDL2.dmg
          sudo cp -vr /Volumes/SDL2/SDL2.framework /Library/Frameworks
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Name the branch for the version string
        run: git checkout -B "$MOD_BRANCH"
      - name: Build pd.${{ matrix.arch }}
        run: |
          cmake -G"Unix Makefiles" -Bbuild -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DUPDATE_CHANNEL="$UPDATE_CHANNEL" .
          cmake --build build --target pd -j4 --clean-first
      - name: Prepare artifact for packaging
        run: |
          mkdir -p bin/data
          cp build/pd.${{ matrix.arch }} bin/
          # macOS carries libcurl in the SDK, so find_package picks up
          # /usr/lib/libcurl.dylib and there is nothing to bundle - but the
          # same silent degradation is possible here, so it is checked the
          # same way the other two are.
          otool -L bin/pd.${{ matrix.arch }} | grep -q libcurl || { echo "::error::built without libcurl"; exit 1; }
          cp -vr /Library/Frameworks/SDL2.framework bin/
          cp README.md LICENSE bin/
          touch bin/data/put_your_rom_here.txt
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pd-dabs-mod-${{ matrix.arch }}-osx
          path: bin/
          retention-days: 0

  publish:
    runs-on: ubuntu-latest
    needs: [ build-x86_64-windows, build-x86_64-linux, build-osx ]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ci-artifacts
      - name: Package
        run: |
          mkdir ci-release
          pushd ci-artifacts
          # upload-artifact round-trips through a zip and drops the executable
          # bit, so the tarballs would ship a game nobody can start.
          chmod +x pd-dabs-mod-x86_64-linux/pd.x86_64 \
                   pd-dabs-mod-x86_64-osx/pd.x86_64 \
                   pd-dabs-mod-arm64-osx/pd.arm64
          tar czf ../ci-release/pd-dabs-mod-x86_64-linux.tar.gz pd-dabs-mod-x86_64-linux
          tar cJf ../ci-release/pd-dabs-mod-x86_64-osx.tar.xz pd-dabs-mod-x86_64-osx
          tar cJf ../ci-release/pd-dabs-mod-arm64-osx.tar.xz pd-dabs-mod-arm64-osx
          zip -r ../ci-release/pd-dabs-mod-x86_64-windows.zip pd-dabs-mod-x86_64-windows
          popd

      # The bare executables, beside the packages rather than instead of them.
      # Check for Updates downloads one file and puts it where the running one
      # is, so what it wants is the program on its own - a package would mean
      # teaching the game to open a zip and two kinds of tarball, one of which
      # is xz and has no decompressor linked into it.
      #
      # Named after the platform string the binary carries in VERSION_TARGET,
      # because that is what the game matches against and because pd.x86_64 for
      # Linux and pd.x86_64 for macOS would otherwise be one asset name for two
      # different programs.
      - name: Lay out the bare builds and write the update manifest
        run: |
          set -eu
          cp ci-artifacts/pd-dabs-mod-x86_64-windows/pd.x86_64.exe ci-release/pd.x86_64-windows.exe
          cp ci-artifacts/pd-dabs-mod-x86_64-linux/pd.x86_64         ci-release/pd.x86_64-linux
          cp ci-artifacts/pd-dabs-mod-x86_64-osx/pd.x86_64           ci-release/pd.x86_64-osx
          cp ci-artifacts/pd-dabs-mod-arm64-osx/pd.arm64             ci-release/pd.arm64-osx

          # The commit the binaries were built from, in the same form CMake put
          # inside them: `git rev-parse --short` picks its own length and both
          # sides have to agree, so both sides ask git rather than cutting a
          # fixed number of characters off $GITHUB_SHA.
          COMMIT="$(git rev-parse --short HEAD)"
          # A tag names itself. The rolling build has no name of its own and is
          # a different program every push, so it is named after the commit -
          # which is what the game shows the player next to "is out".
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          VERSION="${VERSION:-dev-$COMMIT}"

          {
            echo "version $VERSION"
            echo "commit $COMMIT"
            for target in x86_64-windows.exe x86_64-linux x86_64-osx arm64-osx; do
              file="pd.$target"
              # The target string is the file name without the .exe, which is
              # part of the name Windows needs and not part of the platform.
              name="${target%.exe}"
              sha="$(sha256sum "ci-release/$file" | cut -d" " -f1)"
              size="$(stat -c%s "ci-release/$file")"
              echo "build $name $file $sha $size"
            done
          } > ci-release/update.txt

          cat ci-release/update.txt

      # A tag is a release someone will still be downloading in a year, so it is
      # created once and only ever has assets added. `gh release create` without
      # --prerelease also makes it the repo's "Latest", which is what a visitor
      # who is not looking for a dev build should land on.
      - name: Publish stable release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ github.ref_name }}
        run: |
          gh release view "$VER" >/dev/null 2>&1 || \
            gh release create "$VER" \
              --title "Dab's Mod $VER" \
              --notes "Perfect Dark with jump, a combat roll, melee combos, a third person camera, up to 80 simulants, a spectator camera, screenshots and video recording.

          You need your own Perfect Dark \`ntsc-final\` ROM — see README.md inside the download for where it goes."
          gh release upload --clobber "$VER" ci-release/*

      # The rolling build. The tag is moved rather than added to, so the
      # prerelease always describes the tip of the branch and nothing else.
      - name: Publish latest dev build
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag --force dabs-mod-dev "$GITHUB_SHA"
          git push --force origin refs/tags/dabs-mod-dev
          # Upstream's workflow assumes the release already exists, because in
          # its repo someone made it by hand years ago. A fresh repo has no such
          # release and `gh release upload` would fail on the first run.
          gh release view dabs-mod-dev >/dev/null 2>&1 || \
            gh release create dabs-mod-dev --prerelease \
              --title "Dab's Mod (latest dev build)" \
              --notes "Automatic build of the latest \`dabs-mod\` commit, which may be ahead of the stable release and less tested. You need your own Perfect Dark \`ntsc-final\` ROM — see README.md inside the download."
          gh release upload --clobber dabs-mod-dev ci-release/*
